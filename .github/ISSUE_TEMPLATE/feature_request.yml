name: Feature request
description: Suggest a new capability for Procare Connect
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search the existing issues first; the idea may already be listed.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What you are trying to do and why the current entities don't cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
